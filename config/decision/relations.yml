# Controlled relation-learning experiment. Keeps the 12k embedding table for
# comparison with semantic.yml; its dedicated tokenizer uses only 400 tokens.
model:
  vocab_size: 12000
  hidden_size: 256
  encoder_layers: 4
  attention_heads: 4
  ffn_size: 768
  interaction_layers: 1
  position_scale: 0.02
  embedding_norm: true
  score_mode: matching
  pooling: all
  encoding_mode: separate
  dropout: 0.0
input:
  state_max_tokens: 192
  question_option_max_tokens: 128
  truncation: error
training:
  device: auto
  choice_microbatch: 32
  gradient_accumulation: 1
  learning_rate: 0.0003
  warmup_steps: 50
  steps: 2000
  eval_every: 200
  checkpoint_every: 500
  early_stopping_patience: 4
  balance_sources: false
  paired_sampling: true
runtime:
  gpu_memory_budget_mib: 4096
  candidate_chunk_size: 16
  cache_entries: 16
growth:
  enabled: false
