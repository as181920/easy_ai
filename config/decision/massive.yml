# Scratch supervised intent matching; see README for the complete pipeline command.
model:
  vocab_size: 32000
  hidden_size: 256
  encoder_layers: 4
  attention_heads: 4
  ffn_size: 768
  interaction_layers: 1
  position_scale: 0.02
  embedding_norm: true
  score_mode: matching
  dropout: 0.1
input:
  state_max_tokens: 256
  question_option_max_tokens: 64
  truncation: error
training:
  device: auto
  precision: float32
  choice_microbatch: 32
  mlm_microbatch: 8
  gradient_accumulation: 1
  learning_rate: 0.0005
  warmup_steps: 50
  steps: 1000
  eval_every: 100
  checkpoint_every: 200
  early_stopping_patience: 6
  selection_min_delta: 0.001
  balance_labels: true
  resample_negatives: true
runtime:
  gpu_memory_budget_mib: 4096
  candidate_chunk_size: 16
  cache_entries: 16
growth:
  enabled: false
